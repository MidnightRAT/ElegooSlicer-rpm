name: Build ElegooSlicer RPM

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.copr/**'
  workflow_dispatch:
  schedule:
    # Run weekly to check for new releases
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /github 2>/dev/null || df -h /
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/share/swift /usr/local/share/powershell /usr/share/powershell \
            /usr/local/lib/python* /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf /usr/share/doc /usr/share/man /usr/share/info 2>/dev/null || true
          rm -rf /root/.cache /root/.npm /var/cache /var/lib/apt/lists 2>/dev/null || true
          dnf -y clean all 2>/dev/null || true
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build rpmdevtools git git-lfs wget curl unzip \
            cmake ninja-build gcc gcc-c++ make patch pkgconf \
            autoconf automake libtool m4 \
            perl-FindBin perl-IPC-Cmd \
            texinfo gettext python3 \
            libquadmath-devel \
            dbus-devel gtk3-devel webkit2gtk4.1-devel \
            glew-devel glfw-devel mesa-libGLU-devel mesa-libGL-devel libglvnd-devel \
            libjpeg-turbo-devel libpng-devel \
            openssl-devel libcurl-devel \
            freetype-devel fontconfig-devel \
            eigen3-devel cereal-devel \
            gmp-devel mpfr-devel qhull-devel draco-devel draco-static CGAL-devel \
            extra-cmake-modules eglexternalplatform-devel wayland-devel wayland-protocols-devel \
            gstreamer1-devel gstreamer1-plugins-good gstreamermm-devel \
            libX11-devel libXi-devel libXrandr-devel libXinerama-devel \
            libXcursor-devel libXcomposite-devel libXdamage-devel libXext-devel \
            libXtst-devel libXfixes-devel libXmu-devel \
            at-spi2-core-devel libepoxy-devel \
            libspnav-devel libsecret-devel libmspack-devel \
            desktop-file-utils \
            tbb-devel blosc-devel NLopt-devel opencv-devel \
            zlib-ng-compat-devel expat-devel openexr-devel

      - name: Get latest release version
        id: version
        run: |
          # Get latest release tag from GitHub API (strip 'v' prefix)
          LATEST=$(curl -sL https://api.github.com/repos/ELEGOO-3D/ElegooSlicer/releases/latest | grep '"tag_name"' | cut -d '"' -f 4 | sed 's/^v//')
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST}"

      - name: Download source tarball
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Download source tarball from release (with 'v' prefix)
          wget -q "https://github.com/elegoo-repo/ElegooSlicer/archive/refs/tags/v${VERSION}.tar.gz" \
            -O ElegooSlicer-${VERSION}.tar.gz

      - name: Prepare RPM build tree
        run: |
          VERSION=${{ steps.version.outputs.version }}
          rpmdev-setuptree
          cp ElegooSlicer-${VERSION}.tar.gz ~/rpmbuild/SOURCES/
          cp README.md ~/rpmbuild/SOURCES/
          for p in patches/0*.patch; do
            cp "$p" ~/rpmbuild/SOURCES/
          done

      - name: Update spec file with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Create spec file from template with correct version
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@RELEASE@/4/g" \
              elegoo-slicer.spec > ~/rpmbuild/SPECS/elegoo-slicer.spec

      - name: Build RPM and SRPM
        run: |
          cd ~/rpmbuild
          rpmbuild -ba SPECS/elegoo-slicer.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: elegoo-slicer-rpm
          path: |
            ~/rpmbuild/RPMS/x86_64/*.rpm
            ~/rpmbuild/SRPMS/*.rpm
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ElegooSlicer ${{ steps.version.outputs.version }}
          files: |
            ~/rpmbuild/RPMS/x86_64/*.rpm
            ~/rpmbuild/SRPMS/*.rpm
          fail_on_unmatched_files: true
          make_latest: true
